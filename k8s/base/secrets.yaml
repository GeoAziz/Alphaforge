apiVersion: v1
kind: Secret
metadata:
  name: alphaforge-secrets
  namespace: alphaforge
  labels:
    app.kubernetes.io/name: alphaforge
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://alphaforge:${DB_PASSWORD}@postgres-primary:5432/alphaforge"
  SUPABASE_URL: "${SUPABASE_URL}"
  SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
  SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"

  # Firebase
  FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  FIREBASE_API_KEY: "${FIREBASE_API_KEY}"

  # Exchange API Keys
  BINANCE_API_KEY: "${BINANCE_API_KEY}"
  BINANCE_SECRET_KEY: "${BINANCE_SECRET_KEY}"
  BYBIT_API_KEY: "${BYBIT_API_KEY}"
  BYBIT_SECRET_KEY: "${BYBIT_SECRET_KEY}"
  OKX_API_KEY: "${OKX_API_KEY}"
  OKX_SECRET_KEY: "${OKX_SECRET_KEY}"
  OKX_PASSPHRASE: "${OKX_PASSPHRASE}"

  # LLM
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"

  # Compliance
  KYC_PROVIDER_API_KEY: "${KYC_PROVIDER_API_KEY}"

  # Payments
  STRIPE_API_KEY: "${STRIPE_API_KEY}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"

  # Notifications
  SENDGRID_API_KEY: "${SENDGRID_API_KEY}"

  # Monitoring
  SENTRY_DSN: "${SENTRY_DSN}"
  POSTHOG_API_KEY: "${POSTHOG_API_KEY}"

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alphaforge.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "alphaforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alphaforge.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "alphaforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

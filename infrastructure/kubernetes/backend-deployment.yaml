apiVersion: v1
kind: Namespace
metadata:
  name: alphaforge
  labels:
    name: alphaforge

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alphaforge-backend
  namespace: alphaforge

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alphaforge-config
  namespace: alphaforge
data:
  API_ENV: "production"
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  MAX_CONCURRENT_REQUESTS: "1000"
  ALLOW_UNAUTHENTICATED_DEV: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: alphaforge-secrets
  namespace: alphaforge
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@alphaforge-db:5432/alphaforge"
  REDIS_URL: "redis://alphaforge-redis:6379"
  FIREBASE_SERVICE_ACCOUNT_PATH: "/secrets/firebase-key.json"
  JWT_SECRET: "your-secret-key-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphaforge-backend
  namespace: alphaforge
  labels:
    app: alphaforge-backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: alphaforge-backend
  template:
    metadata:
      labels:
        app: alphaforge-backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alphaforge-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: backend
        image: ghcr.io/alphaforge/backend:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 8001
          protocol: TCP

        envFrom:
        - configMapRef:
            name: alphaforge-config
        - secretRef:
            name: alphaforge-secrets

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
        - name: firebase-key
          mountPath: /secrets
          readOnly: true

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: firebase-key
        secret:
          secretName: firebase-key-secret
          optional: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alphaforge-backend
              topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: alphaforge-backend

---
apiVersion: v1
kind: Service
metadata:
  name: alphaforge-backend
  namespace: alphaforge
  labels:
    app: alphaforge-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 8001
    targetPort: metrics
    protocol: TCP
  selector:
    app: alphaforge-backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphaforge-backend-hpa
  namespace: alphaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphaforge-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alphaforge-backend-pdb
  namespace: alphaforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alphaforge-backend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alphaforge-backend-policy
  namespace: alphaforge
spec:
  podSelector:
    matchLabels:
      app: alphaforge-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
  - to:
    - podSelector:
        matchLabels:
          app: alphaforge-backend
    ports:
    - protocol: TCP
      port: 8000

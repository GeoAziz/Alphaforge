apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphaforge-frontend
  namespace: alphaforge
  labels:
    app: alphaforge-frontend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: alphaforge-frontend
  template:
    metadata:
      labels:
        app: alphaforge-frontend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/_next/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: frontend
        image: ghcr.io/alphaforge/frontend:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.alphaforge.example.com"
        - name: NODE_ENV
          value: "production"

        livenessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /.next

      volumes:
      - name: tmp
        emptyDir: {}
      - name: nextjs-cache
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alphaforge-frontend
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: alphaforge-frontend
  namespace: alphaforge
  labels:
    app: alphaforge-frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: alphaforge-frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphaforge-frontend-hpa
  namespace: alphaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphaforge-frontend
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alphaforge-frontend-pdb
  namespace: alphaforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alphaforge-frontend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alphaforge-ingress
  namespace: alphaforge
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - alphaforge.example.com
    - api.alphaforge.example.com
    secretName: alphaforge-tls
  rules:
  - host: alphaforge.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alphaforge-frontend
            port:
              number: 80
  - host: api.alphaforge.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alphaforge-backend
            port:
              number: 80

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "alphaforge-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: alphaforge-backend
          env: production

  - job_name: "alphaforge-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: "alphaforge-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: "alphaforge-kafka"
    static_configs:
      - targets: ["kafka:9308"]
        labels:
          service: kafka

  - job_name: "alphaforge-clickhouse"
    static_configs:
      - targets: ["clickhouse:8123"]
        labels:
          service: clickhouse

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: infrastructure
